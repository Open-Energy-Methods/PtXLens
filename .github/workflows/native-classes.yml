name: Compile genuine openLCA native GWP calculator classes for private local BAFU
on:
  push:
    branches: ['feat/wp0-screening-core']
    paths:
      - '.github/workflows/native-classes.yml'
      - 'native-openlca/src/main/java/org/openenergymethods/ptxlens/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-open-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: native-openlca/pom.xml
      - run: mvn --batch-mode -ntp -f native-openlca/pom.xml -DskipTests compile
      - name: Only upload compiled Open Energy Methods classes; NEVER any user BAFU inventory
        uses: actions/upload-artifact@v4
        with:
          name: original-openlca-private-calculation-class-only
          path: native-openlca/target/classes/
          if-no-files-found: error
          retention-days: 7
