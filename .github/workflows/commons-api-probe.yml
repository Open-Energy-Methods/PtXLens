name: Live Federal LCA Commons provider discovery (real API, no guessed matches)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  query-real-commons:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      LCA_COMMONS_API_KEY: ${{ secrets.LCA_COMMONS_API_KEY }}
    steps:
      - name: Require user's personal free API key (never use DEMO_KEY for automated workflows)
        run: |
          test -n "$LCA_COMMONS_API_KEY" || { echo "Set LCA_COMMONS_API_KEY in repository Actions secrets (free key from api.data.gov)"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Query real material provider records in FLCAC Commons Merged
        run: |
          mkdir -p outputs/commons_probe
          python -m ptxlens.commons_probe --all --output outputs/commons_probe/api_raw_observations.json
          python -m ptxlens.provider_coverage \
            --source outputs/commons_probe/api_raw_observations.json \
            --csv outputs/commons_probe/lci_provider_coverage.csv \
            --manifest outputs/commons_probe/provider_coverage_manifest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-federal-commons-provider-api-evidence
          path: outputs/commons_probe/
          retention-days: 20
          if-no-files-found: warn
