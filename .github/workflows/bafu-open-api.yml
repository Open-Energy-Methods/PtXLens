name: Live Swiss BAFU 2026 official GWP API schema and provider discovery
on:
  push:
    branches: [feat/wp0-screening-core]
    paths:
      - '.github/workflows/bafu-open-api.yml'
      - 'src/ptxlens/bafu_ogd.py'
      - 'src/ptxlens/bafu_candidates.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bafu-ogd:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Real no-auth Swiss FOEN GraphQL schema and impact-factor namespace
        run: |
          mkdir -p outputs/bafu_ogd
          python -m ptxlens.bafu_ogd --output outputs/bafu_ogd/official_schema_and_provider_provenance.json
      - name: Query actual BAFU 2026 IPCC GWP100 material and water processes
        run: |
          python -m ptxlens.bafu_candidates --scope pilot --max-hits 300 \
            --output outputs/bafu_ogd/real_process_candidates.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("outputs/bafu_ogd/real_process_candidates.json")
          x=json.loads(p.read_text())
          assert x['database_version']=='BAFU:2026 v1'
          assert x['method']=='IPCC 2021' and x['category']=='GWP 100'
          assert x['verified_foreground_provider_links']==0
          print('authentic source matched process records',x['available_candidate_process_records'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genuine-swiss-bafu-2026-public-api-evidence
          path: outputs/bafu_ogd/
          retention-days: 90
          if-no-files-found: warn
