name: verification
on:
  push:
    branches: [main, 'feat/**']
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
concurrency:
  group: core-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - uses: actions/checkout@v4
        with:
          repository: Open-Energy-Methods/PtXFlex
          ref: 15fb0b270ada39c86e152b26c30d6d0f66ff3171
          path: _external_ptxflex_source
          persist-credentials: false
      - run: python -m pip install -e "./_external_ptxflex_source[physics]"
      - run: python -m pytest -q
      # Offline cross-repository L3-G smoke: source-only artifacts and immutable audit.
      # This does not rerun private original hourly MILPs or run openLCA/PED/OEM approval.
      - name: Paired L3-G source publication gate
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/l3g-flex" "$RUNNER_TEMP/l3g-lens"
          python -m ptxflex.f2l3f_stationary_thermal_qualification --output-dir "$RUNNER_TEMP/l3g-flex"
          python -m ptxflex.f2l3f_stationary_site_evidence_gate --output-dir "$RUNNER_TEMP/l3g-flex"
          python -m ptxlens.l3f_h30_cost_qualification_bridge --output-dir "$RUNNER_TEMP/l3g-lens"
          python -m ptxlens.l3f_bafu_native_mapping_contract --output-dir "$RUNNER_TEMP/l3g-lens"
          python -m ptxlens.l3g_release_qualification --lens-results "$RUNNER_TEMP/l3g-lens" --flex-results "$RUNNER_TEMP/l3g-flex" --output-dir "$RUNNER_TEMP/l3g-lens"
          python -m ptxlens.l3g_release_qualification --lens-results "$RUNNER_TEMP/l3g-lens" --flex-results "$RUNNER_TEMP/l3g-flex" --output-dir "$RUNNER_TEMP/l3g-lens" --verify-only
      - run: ptxlens assess examples/illustrative.json --output /tmp/ptxlens_result.json
      - run: ptxlens inventory examples/illustrative.json --output /tmp/ptxlens_inventory.json
