name: verification
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: ptxlens assess examples/illustrative.json --output /tmp/ptxlens_result.json
      - run: ptxlens inventory examples/illustrative.json --output /tmp/ptxlens_inventory.json
