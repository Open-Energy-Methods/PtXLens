name: Acquire official GPL UMFPACK sparse solver for private BAFU calculations
on:
  push:
    branches: ['feat/wp0-screening-core']
    paths:
      - '.github/workflows/native-sparse-solver.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire-solver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Download official GPL UMFPACK sparse library from GreenDelta upstream v0.0.1 GitHub release
        run: |
          mkdir -p offline_umfpack/
          curl -fL --retry 3 --retry-all-errors             'https://github.com/GreenDelta/olca-native/releases/download/v0.0.1/olca-native-umfpack-linux-x64.zip'             -o /tmp/openlca_umfpack_upstream_release.zip
          python - <<'PY'
          import zipfile,hashlib,json
          from pathlib import Path
          path=Path('/tmp/openlca_umfpack_upstream_release.zip')
          with zipfile.ZipFile(path) as z:
              entries=z.namelist()
              print('source original ZIP SHA256',hashlib.sha256(path.read_bytes()).hexdigest())
              print('original UMFPACK members',entries[:40])
              assert len(entries)>4
              for m in entries:
                  assert not m.startswith('/') and '..' not in m.split('/')
              z.extractall('offline_umfpack/')
          PY
      - name: Record special GPL obligations for optional sparse solver
        run: |
          cat > offline_umfpack/README_GPL_LICENSE.txt <<'TXT'
          Optional GPL-licensed UMFPACK sparse solver for private LCA.
          Upstream source: https://github.com/GreenDelta/olca-native
          Native UMFPACK implements GPLv2/3; original GreenDelta desktop
          application does not bundle this optional library for license reasons.
          This independent research tooling is not a claim that UMFPACK is
          included in the MPL-licensed openLCA application.
          Full source and original licensing: GreenDelta/olca-native.
          TXT
      - uses: actions/upload-artifact@v4
        with:
          name: official-optional-gpl-umfpack-linux-x64-native-sparse-solver
          path: offline_umfpack/
          retention-days: 7
          if-no-files-found: error
