name: Real openLCA 2.7 native engine diagnostic — original Commons source
on:
  push:
    branches: ['feat/wp0-screening-core']
    paths:
      - 'native-openlca/**'
      - '.github/workflows/native-openlca.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-uslci-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MAVEN_OPTS: -Xmx5g -XX:MaxMetaspaceSize=512m
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: native-openlca/pom.xml
      - run: python -m pip install -e .
      - name: Download and byte-verify source archive without changing any flows
        run: |
          mkdir -p /tmp/ptxlens-native outputs/native_openlca
          python -m ptxlens.commons_public \
            --archive /tmp/ptxlens-native/commons_original_2026.jsonld.zip \
            --manifest outputs/native_openlca/original_source_provenance.json
          python - <<'PY'
          import hashlib,pathlib
          path=pathlib.Path('/tmp/ptxlens-native/commons_original_2026.jsonld.zip')
          assert hashlib.sha256(path.read_bytes()).hexdigest() == '1ded185617d4de67f8ed6933c473a68d65c232dd738779179e8559a31dfd056d'
          PY
      - name: Execute genuine openLCA 2.7.0 Java importer and native LCA kernel
        run: |
          set -o pipefail
          mvn --batch-mode -ntp -f native-openlca/pom.xml \
            -Dexec.mainClass=org.openenergymethods.ptxlens.DiagnosticNativeCalculation \
            -Dexec.args="/tmp/ptxlens-native/commons_original_2026.jsonld.zip /tmp/ptxlens-native/db/commons2026" \
            compile exec:java 2>&1 | tee outputs/native_openlca/openlca_native_engine_execution.log
      - name: Preserve exact source and explicitly reject any complete-LCA claim
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib,re
          log=pathlib.Path('outputs/native_openlca/openlca_native_engine_execution.log')
          source=pathlib.Path('outputs/native_openlca/original_source_provenance.json')
          lines=log.read_text(errors='replace') if log.exists() else ''
          gwp=re.search(r'PTXLENS_NATIVE_AR6_100_KG_CO2E_PER_KG_US_REFERENCE_H2\s+([+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:[Ee][+-]?\d+)?)',lines)
          missing=re.search(r'PTXLENS_NATIVE_UNLINKED_PRODUCT_INPUT_COUNT\s+(\d+)',lines)
          actual_missing=int(missing.group(1)) if missing else None
          report={
             'schema_version':'ptxlens.native_openlca_uslci_diagnostic.v0.1',
             'source_archive_sha256':'1ded185617d4de67f8ed6933c473a68d65c232dd738779179e8559a31dfd056d',
             'original_source_manifest_recorded':source.exists(),
             'engine':'actual openLCA-core 2.7.0 Java kernel; not a reimplementation or a factor multiplication',
             'source_process':'USLCI 2017 reference 1kg dried H2 from PEM; not 2023 NL',
             'impact_method':'IPCC AR6-100',
             'native_engine_reached_impact_result':gwp is not None,
             'native_unlinked_product_inputs_after_automatic_linking':actual_missing,
             'native_product_system_linking_complete':actual_missing==0,
             'mass_balance_source_discrepancy':'original USLCI lists 12kg O2 output with 1kg H2, 9kg deionized water input; stoichiometry unreconciled',
             'native_truncated_reference_impact_value':float(gwp.group(1)) if gwp else None,
             'native_result_scientific_status':'DIAGNOSTIC ONLY: original 695 missing source-default links, native auto-link residual recorded separately; 2017 US reference physically and geographically not Netherlands 2023',
             'can_claim_full_cradle_to_gate_lca':False,
             'can_claim_2023_netherlands_ptxlens_lca':False,
             'limitations':'2017 US model with original unmodified Commons data, missing suppliers, no Dutch electricity/BoP/storage/transport adaptation; no ISO 14044 assertion',
             'upstream_provider_gap_audit':'https://github.com/Open-Energy-Methods/PtXLens/blob/feat/wp0-screening-core/docs/COMMONS_MERGED_2026_PROVIDER_AUDIT.md'
          }
          target=pathlib.Path('outputs/native_openlca/native_diagnostic_status.json')
          target.write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          if not report['native_engine_reached_impact_result'] or actual_missing is None:
              raise RuntimeError("actual native engine or post-auto-link scientific integrity audit did not execute")
          print(json.dumps(report,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-openlca-2-7-uslci-reference-diagnostic-not-full-lca
          path: outputs/native_openlca/
          retention-days: 90
          if-no-files-found: error
