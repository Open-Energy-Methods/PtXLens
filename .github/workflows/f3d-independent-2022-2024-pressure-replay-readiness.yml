name: PtXLens F3-D independent hydrogen-EOS witness-method regression
on:
  push:
    branches: ['feat/wp0-screening-core']
    paths:
      - 'src/ptxlens/f3d_external_year_private_witness_replay.py'
      - 'tests/test_f3d_external_year_private_witness_eos.py'
      - '.github/workflows/f3d-independent-2022-2024-pressure-replay-readiness.yml'
permissions:
  contents: read
jobs:
  independent_source_model_EOS:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]' CoolProp==8.0.0
      - name: Recompute standalone hydrogen EOS, gas-bank limits and historical witness algebra tests
        run: python -m pytest -q tests/test_f3d_external_year_private_witness_eos.py tests/test_f3d_external_year_private_witness_replay.py
