name: Inspect real USLCI 1kg PEM H2 process and provider UUIDs
on:
  push:
    branches: [feat/wp0-screening-core]
    paths:
      - '.github/workflows/commons-pem-process.yml'
      - 'src/ptxlens/commons_process.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  get-real-process:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      LCA_COMMONS_API_KEY: ${{ secrets.LCA_COMMONS_API_KEY || 'DEMO_KEY' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Query official federal LCA Commons original reference process UUID
        run: |
          mkdir -p outputs/commons_pem_process
          python -m ptxlens.commons_process \
            --output outputs/commons_pem_process/real_uslci_pem_1kg_process_audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: federal-commons-uslci-actual-pem-hydrogen-exchange-and-link-audit
          path: outputs/commons_pem_process/
          retention-days: 60
          if-no-files-found: warn
